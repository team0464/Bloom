<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bloom — ปฏิทิน</title>


    <style>

        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        :root {

            --pink: #d25f89;
            --pink-dark: #b84e77;
            --pink-light: #fce9f0;

            --purple: #8d76c9;
            --purple-light: #eeeafb;

            --text: #302832;
            --soft: #786c75;
            --muted: #aaa0a7;

            --bg: #fcfafb;
            --white: #ffffff;

            --border: #eee6eb;

        }


        body {

            font-family:
                "Noto Sans Thai",
                "DM Sans",
                sans-serif;

            color: var(--text);

            min-height: 100vh;

            background:

                radial-gradient(
                    circle at 90% 0%,
                    #f3eafa,
                    transparent 30%
                ),

                radial-gradient(
                    circle at 0% 30%,
                    #fcebf1,
                    transparent 25%
                ),

                var(--bg);

        }


        button {
            font-family: inherit;
        }


        /* =========================
           HEADER
        ========================= */

        .header {

            width: 90%;
            max-width: 1100px;

            height: 78px;

            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;

        }


        .logo {

            display: flex;
            align-items: center;

            gap: 10px;

            font-family: "DM Sans", sans-serif;

            font-size: 21px;

            font-weight: 700;

        }


        .logo-icon {

            width: 36px;
            height: 36px;

            display: grid;
            place-items: center;

            border-radius: 11px;

            color: white;

            background:

                linear-gradient(
                    135deg,
                    #d7648d,
                    #9c79cf
                );

        }


        .back-btn {

            border: 1px solid var(--border);

            background: white;

            color: var(--soft);

            padding: 9px 15px;

            border-radius: 12px;

            cursor: pointer;

            font-size: 11px;

            transition: 0.2s;

        }


        .back-btn:hover {

            background: #fff8fb;

            transform: translateY(-1px);

        }


        /* =========================
           MAIN
        ========================= */

        .container {

            width: 90%;
            max-width: 1100px;

            margin: auto;

            padding-bottom: 120px;

        }


        .page-title {

            padding-top: 25px;

            margin-bottom: 25px;

        }


        .page-title small {

            color: var(--muted);

            font-size: 11px;

        }


        .page-title h1 {

            margin-top: 5px;

            font-family:
                "DM Sans",
                "Noto Sans Thai",
                sans-serif;

            font-size: 35px;

            letter-spacing: -1px;

        }


        .page-title p {

            margin-top: 5px;

            color: var(--soft);

            font-size: 12px;

        }


        /* =========================
           CALENDAR CARD
        ========================= */

        .calendar-card {

            background: white;

            border: 1px solid var(--border);

            border-radius: 27px;

            padding: 30px;

            box-shadow:
                0 18px 50px
                rgba(70,50,65,0.06);

        }


        /* =========================
           CALENDAR HEADER
        ========================= */

        .calendar-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 25px;

        }


        .month-title {

            text-align: center;

            flex: 1;

        }


        .month-title strong {

            display: block;

            font-family: "DM Sans", sans-serif;

            font-size: 22px;

            font-weight: 700;

        }


        .month-title small {

            color: var(--muted);

            font-size: 10px;

        }


        .month-btn {

            width: 40px;
            height: 40px;

            border-radius: 12px;

            border: 1px solid var(--border);

            background: white;

            color: var(--soft);

            cursor: pointer;

            font-size: 18px;

            transition: 0.2s;

        }


        .month-btn:hover {

            background: var(--pink-light);

            color: var(--pink);

        }


        /* =========================
           WEEK
        ========================= */

        .weekdays {

            display: grid;

            grid-template-columns:
                repeat(7, 1fr);

            gap: 8px;

            margin-bottom: 8px;

        }


        .weekday {

            text-align: center;

            padding: 8px 0;

            color: var(--muted);

            font-size: 10px;

            font-weight: 600;

        }


        /* =========================
           DAYS
        ========================= */

        .calendar-grid {

            display: grid;

            grid-template-columns:
                repeat(7, 1fr);

            gap: 8px;

        }


        .day {

            min-height: 76px;

            border-radius: 15px;

            border: 1px solid transparent;

            background: #fdfbfc;

            position: relative;

            padding: 10px;

            transition: 0.2s;

        }


        .day-number {

            font-family: "DM Sans", sans-serif;

            font-size: 13px;

            font-weight: 600;

        }


        .day.other-month {

            opacity: 0.25;

        }


        .day.today {

            border-color: var(--purple);

        }


        .day.today .day-number {

            color: var(--purple);

        }


        /* =========================
           PERIOD
        ========================= */

        .day.period {

            background: var(--pink-light);

            border-color: #f4cbd9;

        }


        .day.period .day-number {

            color: var(--pink-dark);

        }


        .period-dot {

            position: absolute;

            bottom: 9px;
            left: 10px;

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--pink);

        }


        /* =========================
           PREDICTED
        ========================= */

        .day.predicted {

            background: var(--purple-light);

            border-color: #d8cff1;

        }


        .day.predicted .day-number {

            color: #7560ad;

        }


        .predicted-dot {

            position: absolute;

            bottom: 9px;
            left: 10px;

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--purple);

        }


        /* =========================
           LEGEND
        ========================= */

        .legend {

            display: flex;

            flex-wrap: wrap;

            gap: 20px;

            margin-top: 24px;

            padding-top: 20px;

            border-top: 1px solid var(--border);

        }


        .legend-item {

            display: flex;

            align-items: center;

            gap: 7px;

            color: var(--soft);

            font-size: 10px;

        }


        .legend-dot {

            width: 9px;
            height: 9px;

            border-radius: 50%;

        }


        .legend-period {

            background: var(--pink);

        }


        .legend-predicted {

            background: var(--purple);

        }


        .legend-today {

            border: 2px solid var(--purple);

            background: white;

        }


        /* =========================
           SUMMARY
        ========================= */

        .summary {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 16px;

            margin-top: 18px;

        }


        .summary-card {

            background: white;

            border: 1px solid var(--border);

            border-radius: 20px;

            padding: 21px;

        }


        .summary-icon {

            width: 37px;
            height: 37px;

            display: grid;
            place-items: center;

            border-radius: 11px;

            background: var(--pink-light);

        }


        .summary-card:nth-child(2)
        .summary-icon {

            background: var(--purple-light);

        }


        .summary-card:nth-child(3)
        .summary-icon {

            background: #eaf2fb;

        }


        .summary-label {

            margin-top: 15px;

            color: var(--muted);

            font-size: 10px;

        }


        .summary-value {

            margin-top: 4px;

            font-family: "DM Sans", sans-serif;

            font-size: 18px;

            font-weight: 700;

        }


        /* =========================
           EMPTY
        ========================= */

        .empty {

            padding: 50px 20px;

            text-align: center;

            color: var(--muted);

            font-size: 12px;

        }


        .empty-icon {

            font-size: 35px;

            margin-bottom: 10px;

        }


        /* =========================
           NAV
        ========================= */

        .bottom-nav {

            position: fixed;

            left: 50%;

            bottom: 18px;

            transform: translateX(-50%);

            width: 92%;

            max-width: 720px;

            height: 72px;

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            align-items: center;

            background: rgba(255,255,255,0.96);

            border: 1px solid var(--border);

            border-radius: 25px;

            box-shadow:
                0 15px 45px
                rgba(60,40,55,0.12);

            backdrop-filter: blur(12px);

            z-index: 1000;

        }


        .nav-item {

            height: 54px;

            margin: 5px;

            border-radius: 16px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 3px;

            color: var(--muted);

            cursor: pointer;

            font-size: 9px;

            transition: 0.2s;

        }


        .nav-icon {

            font-size: 16px;

        }


        .nav-item.active {

            background: var(--pink-light);

            color: var(--pink);

        }


        .nav-item:hover {

            color: var(--pink);

        }


        /* =========================
           DARK MODE
        ========================= */

        body.dark {

            --bg: #171419;

            --white: #211d22;

            --text: #f5eef3;

            --soft: #c3b7bf;

            --muted: #93868f;

            --border: #332c34;

            background:

                radial-gradient(
                    circle at 90% 0%,
                    #28203a,
                    transparent 30%
                ),

                radial-gradient(
                    circle at 0% 30%,
                    #321f29,
                    transparent 25%
                ),

                var(--bg);

        }


        body.dark .calendar-card,
        body.dark .summary-card,
        body.dark .bottom-nav {

            background: #211d22;

        }


        body.dark .day {

            background: #1e1a1f;

        }


        body.dark .month-btn,
        body.dark .back-btn {

            background: #211d22;

            color: var(--soft);

        }


        body.dark .day.period {

            background: #38212c;

            border-color: #633c4c;

        }


        body.dark .day.predicted {

            background: #28233a;

            border-color: #49416b;

        }


        body.dark .legend-today {

            background: #211d22;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .header {

                width: 92%;

                height: 68px;

            }


            .container {

                width: 92%;

                padding-bottom: 110px;

            }


            .page-title {

                padding-top: 15px;

                margin-bottom: 18px;

            }


            .page-title h1 {

                font-size: 28px;

            }


            .calendar-card {

                padding: 15px;

                border-radius: 22px;

            }


            .calendar-header {

                margin-bottom: 15px;

            }


            .month-title strong {

                font-size: 18px;

            }


            .month-btn {

                width: 36px;
                height: 36px;

            }


            .weekdays {

                gap: 4px;

            }


            .calendar-grid {

                gap: 4px;

            }


            .day {

                min-height: 55px;

                padding: 7px;

                border-radius: 11px;

            }


            .day-number {

                font-size: 11px;

            }


            .period-dot,
            .predicted-dot {

                width: 6px;
                height: 6px;

                bottom: 6px;
                left: 7px;

            }


            .summary {

                grid-template-columns:
                    1fr;

                gap: 10px;

            }


            .summary-card {

                padding: 17px;

            }


            .bottom-nav {

                height: 68px;

                bottom: 10px;

            }


            .nav-item {

                height: 52px;

            }

        }


        @media (max-width: 390px) {

            .calendar-card {

                padding: 11px;

            }


            .day {

                min-height: 50px;

                padding: 6px;

            }


            .weekday {

                font-size: 9px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="header">

        <div class="logo">

            <div class="logo-icon">
                🌸
            </div>

            Bloom

        </div>


        <button

        >

    </header>



    <!-- =========================
         MAIN

    <main class="container">

            </small>

            <h1>

            </h1>

            <p>
                ดูประวัติรอบเดือนและวันที่คาดการณ์

        <!-- =========================

        <section class="calendar-card">

            <!-- WEEKDAYS -->

            <div class="weekdays">

                <div class="weekday">

                </div>


                <div class="legend-item">

        </section>



        <!-- =========================

        <section class="summary">


            <div class="summary-card">

            <div class="summary-card">

                </div>

            <div class="summary-card">

                    คาดการณ์ครั้งถัดไป

                </div>

            </div>


        </section>


    </main>



    <!-- =========================
         BOTTOM NAV
    ========================= -->

    <nav class="bottom-nav">


        <div
            class="nav-item"
            onclick="goDashboard()"
        >

            <div class="nav-icon">
                ⌂
            </div>

            หน้าหลัก

        </div>


        <div
            class="nav-item active"
        >

            <div class="nav-icon">
                ▣
            </div>

            ปฏิทิน

        </div>


        <div
            class="nav-item"
            onclick="goDashboardStats()"
        >

            <div class="nav-icon">
                ◈
            </div>

        </div>


        <div
            class="nav-item"

        >

            <div class="nav-icon">

            </div>

            ตั้งค่า

        </div>


    </nav>



    <!-- =========================
         SCRIPT
    ========================= -->

    <script>

        /* =========================
           STORAGE
        ========================= */

        const STORAGE_KEY =
            "bloom_periods";



        /* =========================
           THEME
        ========================= */

        const THEME_KEY =
            "bloom_theme";


        function applyTheme() {

            const theme =
                localStorage.getItem(
                    THEME_KEY
                );

            if (theme === "dark") {

                document.body.classList.add(
                    "dark"
                );

            }

        }


        applyTheme();



        /* =========================
           DATE HELPERS
        ========================= */

        function parseDate(value) {

            if (!value) {
                return null;
            }

            const parts =
                value.split("-");

            return new Date(
                Number(parts[0]),
                Number(parts[1]) - 1,
                Number(parts[2])
            );

        }


        function dateKey(date) {

            const y =
                date.getFullYear();

            const m =
                String(
                    date.getMonth() + 1
                ).padStart(2, "0");

            const d =
                String(
                    date.getDate()
                ).padStart(2, "0");

            return `${y}-${m}-${d}`;

        }


        function formatDate(date) {

            if (!date) {
                return "-";
            }

            return date.toLocaleDateString(
                "th-TH",
                {
                    day: "numeric",
                    month: "short",
                    year: "numeric"
                }
            );

        }


        function addDays(
            date,
            days
        ) {

            const result =
                new Date(date);

            result.setDate(
                result.getDate() + days
            );

            return result;

        }



        /* =========================
           PERIOD DATA
        ========================= */

        function getPeriods() {

            try {

                const data =
                    JSON.parse(
                        localStorage.getItem(
                            STORAGE_KEY
                        )
                    );

                if (
                    !Array.isArray(data)
                ) {

                    return [];

                }

                return data;

            }

            catch (error) {

                return [];

            }

        }



        /* =========================
           CALCULATE DATA
        ========================= */

        function calculateData(
            periods
        ) {

            if (
                periods.length === 0
            ) {

                return {

                    averageCycle: 0,

                    latest: null,

                    nextDate: null

                };

            }


            const sorted =
                [...periods].sort(
                    (a, b) =>
                        parseDate(a.start) -
                        parseDate(b.start)
                );


            let totalCycle = 0;

            let cycleCount = 0;


            for (
                let i = 1;
                i < sorted.length;
                i++
            ) {

                const previous =
                    parseDate(
                        sorted[i - 1].start
                    );

                const current =
                    parseDate(
                        sorted[i].start
                    );


                const diff =
                    Math.round(
                        (
                            current -
                            previous
                        ) /
                        (
                            1000 *
                            60 *
                            60 *
                            24
                        )
                    );


                if (
                    diff > 0 &&
                    diff < 100
                ) {

                    totalCycle += diff;

                    cycleCount++;

                }

            }


            const averageCycle =
                cycleCount > 0
                    ? Math.round(
                        totalCycle /
                        cycleCount
                    )
                    : 28;


            const latest =
                sorted[
                    sorted.length - 1
                ];


            let nextDate = null;


            if (latest) {

                const latestStart =
                    parseDate(
                        latest.start
                    );


                nextDate =
                    addDays(
                        latestStart,
                        averageCycle
                    );

            }


            return {

                averageCycle,

                latest,

                nextDate

            };

        }



        /* =========================
           CURRENT MONTH
        ========================= */

        let currentDate =
            new Date();



        /* =========================
           MONTH NAVIGATION
        ========================= */

        function previousMonth() {

            currentDate.setMonth(
                currentDate.getMonth() - 1
            );

            renderCalendar();

        }


        function nextMonth() {

            currentDate.setMonth(
                currentDate.getMonth() + 1
            );

            renderCalendar();

        }



        /* =========================
           RENDER CALENDAR
        ========================= */

        function renderCalendar() {

            const year =
                currentDate.getFullYear();

            const month =
                currentDate.getMonth();


            const monthName =
                currentDate.toLocaleDateString(
                    "th-TH",
                    {
                        month: "long"
                    }
                );


            document.getElementById(
                "monthTitle"
            ).textContent =
                monthName;


            document.getElementById(
                "monthYear"
            ).textContent =
                year +
                " • ค.ศ. " +
                year;


            const grid =
                document.getElementById(
                    "calendarGrid"
                );


            grid.innerHTML = "";


            const periods =
                getPeriods();


            const data =
                calculateData(
                    periods
                );


            /*
                วันแรกของเดือน
                0 = อาทิตย์
            */

            const firstDay =
                new Date(
                    year,
                    month,
                    1
                );


            const startWeekday =
                firstDay.getDay();


            const daysInMonth =
                new Date(
                    year,
                    month + 1,
                    0
                ).getDate();


            /*
                จำนวนวันของเดือนก่อนหน้า
            */

            const previousDays =
                new Date(
                    year,
                    month,
                    0
                ).getDate();


            /*
                สร้างทั้งหมด 42 ช่อง
                เพื่อให้ปฏิทินสูงเท่ากัน
            */

            for (
                let i = 0;
                i < 42;
                i++
            ) {

                let dayNumber;

                let cellMonth =
                    month;

                let cellYear =
                    year;

                let otherMonth =
                    false;


                if (
                    i < startWeekday
                ) {

                    dayNumber =
                        previousDays -
                        startWeekday +
                        i +
                        1;


                    cellMonth =
                        month - 1;


                    otherMonth =
                        true;


                    if (
                        cellMonth < 0
                    ) {

                        cellMonth = 11;

                        cellYear--;

                    }

                }

                else if (
                    i >=
                    startWeekday +
                    daysInMonth
                ) {

                    dayNumber =
                        i -
                        startWeekday -
                        daysInMonth +
                        1;


                    cellMonth =
                        month + 1;


                    otherMonth =
                        true;


                    if (
                        cellMonth > 11
                    ) {

                        cellMonth = 0;

                        cellYear++;

                    }

                }

                else {

                    dayNumber =
                        i -
                        startWeekday +
                        1;

                }


                const date =
                    new Date(
                        cellYear,
                        cellMonth,
                        dayNumber
                    );


                const cell =
                    document.createElement(
                        "div"
                    );


                cell.className =
                    "day";


                if (
                    otherMonth
                ) {

                    cell.classList.add(
                        "other-month"
                    );

                }



                /* =========================
                   TODAY
                ========================= */

                const today =
                    new Date();


                if (
                    dateKey(date) ===
                    dateKey(today)
                ) {

                    cell.classList.add(
                        "today"
                    );

                }



                /* =========================
                   PERIOD
                ========================= */

                let isPeriod =
                    false;


                for (
                    const period
                    of periods
                ) {

                    const start =
                        parseDate(
                            period.start
                        );


                    const end =
                        parseDate(
                            period.end
                        );


                    if (
                        date >= start &&
                        date <= end
                    ) {

                        isPeriod =
                            true;

                        break;

                    }

                }


                if (
                    isPeriod
                ) {

                    cell.classList.add(
                        "period"
                    );

                }



                /* =========================
                   PREDICTED
                ========================= */

                let isPredicted =
                    false;


                if (
                    data.nextDate
                ) {

                    const predictionStart =
                        data.nextDate;


                    const predictionEnd =
                        addDays(
                            predictionStart,
                            4
                        );


                    if (
                        date >=
                        predictionStart &&
                        date <=
                        predictionEnd
                    ) {

                        isPredicted =
                            true;

                    }

                }



                /*
                    ถ้าเป็นวันจริง
                    ไม่ต้องทับด้วย predicted
                */

                if (
                    isPredicted &&
                    !isPeriod
                ) {

                    cell.classList.add(
                        "predicted"
                    );

                }



                /* =========================
                   DAY CONTENT
                ========================= */

                cell.innerHTML = `

                    <div class="day-number">
                        ${dayNumber}
                    </div>

                    ${
                        isPeriod
                        ?
                        `
                            <div
                                class="period-dot"
                            ></div>
                        `
                        :
                        ""
                    }

                    ${
                        isPredicted &&
                        !isPeriod
                        ?
                        `
                            <div
                                class="predicted-dot"
                            ></div>
                        `
                        :
                        ""
                    }

                `;


                /*
                    ไม่มีระบบกดวันที่
                    ไม่มีบันทึกอาการ
                */

                grid.appendChild(
                    cell
                );

            }


            updateSummary(
                data
            );

        }



        /* =========================
           SUMMARY
        ========================= */

        function updateSummary(
            data
        ) {

            document.getElementById(
                "averageCycle"
            ).textContent =
                data.averageCycle +
                " วัน";


            if (
                data.latest
            ) {

                document.getElementById(
                    "lastPeriod"
                ).textContent =
                    formatDate(
                        parseDate(
                            data.latest.start
                        )
                    );

            }

            else {

                document.getElementById(
                    "lastPeriod"
                ).textContent =
                    "ยังไม่มีข้อมูล";

            }


            if (
                data.nextDate
            ) {

                document.getElementById(
                    "nextPeriod"
                ).textContent =
                    formatDate(
                        data.nextDate
                    );

            }

            else {

                document.getElementById(
                    "nextPeriod"
                ).textContent =
                    "ยังไม่มีข้อมูล";

            }

        }



        /* =========================
           NAVIGATION
        ========================= */

        function goDashboard() {

            window.location.href =
                "dashboard.html";

        }


        function goDashboardStats() {

            window.location.href =
                "stats.html";

        }


        function showInfo() {

            alert(
                "🔒 Bloom ใช้โหมดส่วนตัว\n\n" +
                "ข้อมูลทั้งหมดถูกเก็บไว้ใน Browser ของอุปกรณ์นี้\n\n" +
                "ไม่มีระบบ Login และไม่มีบัญชีผู้ใช้"
            );

        }


        function goSettings() {

            window.location.href =
                "settings.html";

        }



        /* =========================
           START
        ========================= */

        renderCalendar();

    </script>
