<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#fcfafb">

    <title>Bloom — ปฏิทิน</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        :root {

            --pink: #d25f89;
            --pink-dark: #b84e77;
            --pink-light: #fce9f0;

            --purple: #8d76c9;
            --purple-light: #eeeafb;

            --text: #302832;
            --soft: #786c75;
            --muted: #aaa0a7;

            --bg: #fcfafb;
            --white: #ffffff;

            --border: #eee6eb;

        }


        html,
        body {

            width: 100%;
            min-height: 100%;

            overflow-x: hidden;

        }


        body {

            font-family:
                "Noto Sans Thai",
                "Segoe UI",
                Arial,
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 100% 0%,
                    #f3eafa 0%,
                    transparent 30%
                ),
                radial-gradient(
                    circle at 0% 30%,
                    #fcebf1 0%,
                    transparent 25%
                ),
                var(--bg);

        }


        button {

            font-family: inherit;

        }


        /* =========================
           HEADER
        ========================= */

        .header {

            width: calc(100% - 32px);
            max-width: 1100px;

            height: 64px;

            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;

        }


        .logo {

            display: flex;
            align-items: center;

            gap: 8px;

            font-size: 20px;
            font-weight: 700;

        }


        .logo-icon {

            width: 34px;
            height: 34px;

            display: grid;
            place-items: center;

            border-radius: 10px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #d7648d,
                    #9c79cf
                );

        }


        .back-btn {

            border: 1px solid var(--border);

            background: white;

            color: var(--soft);

            padding: 8px 12px;

            border-radius: 10px;

            font-size: 12px;

            cursor: pointer;

        }


        /* =========================
           MAIN
        ========================= */

        .container {

            width: calc(100% - 32px);
            max-width: 1100px;

            margin: 0 auto;

            padding-bottom: 105px;

        }


        .page-title {

            padding-top: 15px;

            margin-bottom: 18px;

        }


        .page-title small {

            color: var(--muted);

            font-size: 9px;

            letter-spacing: 1px;

        }


        .page-title h1 {

            margin-top: 3px;

            font-size: 27px;

            line-height: 1.3;

            font-weight: 700;

        }


        .page-title p {

            margin-top: 4px;

            color: var(--soft);

            font-size: 11px;

        }


        /* =========================
           CALENDAR CARD
        ========================= */

        .calendar-card {

            width: 100%;

            background: white;

            border: 1px solid var(--border);

            border-radius: 20px;

            padding: 16px;

            box-shadow:
                0 12px 35px
                rgba(70,50,65,0.06);

        }


        /* =========================
           CALENDAR HEADER
        ========================= */

        .calendar-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 15px;

        }


        .month-title {

            flex: 1;

            text-align: center;

            min-width: 0;

        }


        .month-title strong {

            display: block;

            font-size: 18px;

            font-weight: 700;

            line-height: 1.3;

        }


        .month-title small {

            display: block;

            margin-top: 2px;

            color: var(--muted);

            font-size: 9px;

        }


        .month-btn {

            flex: 0 0 36px;

            width: 36px;
            height: 36px;

            border-radius: 10px;

            border: 1px solid var(--border);

            background: white;

            color: var(--soft);

            font-size: 20px;

            line-height: 1;

            cursor: pointer;

        }


        .month-btn:active {

            background: var(--pink-light);

            color: var(--pink);

        }


        /* =========================
           WEEK DAYS
        ========================= */

        .weekdays {

            display: grid;

            grid-template-columns:
                repeat(7, minmax(0, 1fr));

            gap: 4px;

            margin-bottom: 4px;

        }


        .weekday {

            min-width: 0;

            text-align: center;

            padding: 5px 0;

            color: var(--muted);

            font-size: 9px;

            font-weight: 600;

        }


        /* =========================
           CALENDAR DAYS
        ========================= */

        .calendar-grid {

            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(7, minmax(0, 1fr));

            gap: 4px;

        }


        .day {

            min-width: 0;

            height: 54px;

            border-radius: 10px;

            border: 1px solid transparent;

            background: #fdfbfc;

            position: relative;

            padding: 7px;

            overflow: hidden;

        }


        .day-number {

            font-size: 11px;

            font-weight: 600;

            line-height: 1;

        }


        .day.other-month {

            opacity: 0.25;

        }


        .day.today {

            border-color: var(--purple);

        }


        .day.today .day-number {

            color: var(--purple);

        }


        /* PERIOD */

        .day.period {

            background: var(--pink-light);

            border-color: #f4cbd9;

        }


        .day.period .day-number {

            color: var(--pink-dark);

        }


        .period-dot {

            position: absolute;

            left: 7px;
            bottom: 7px;

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: var(--pink);

        }


        /* PREDICTED */

        .day.predicted {

            background: var(--purple-light);

            border-color: #d8cff1;

        }


        .day.predicted .day-number {

            color: #7560ad;

        }


        .predicted-dot {

            position: absolute;

            left: 7px;
            bottom: 7px;

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: var(--purple);

        }


        /* =========================
           LEGEND
        ========================= */

        .legend {

            display: flex;

            align-items: center;

            flex-wrap: wrap;

            gap: 12px;

            margin-top: 15px;

            padding-top: 14px;

            border-top: 1px solid var(--border);

        }


        .legend-item {

            display: flex;

            align-items: center;

            gap: 5px;

            color: var(--soft);

            font-size: 9px;

        }


        .legend-dot {

            width: 8px;
            height: 8px;

            flex: 0 0 8px;

            border-radius: 50%;

        }


        .legend-period {

            background: var(--pink);

        }


        .legend-predicted {

            background: var(--purple);

        }


        .legend-today {

            background: white;

            border: 2px solid var(--purple);

        }


        /* =========================
           SUMMARY
        ========================= */

        .summary {

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 10px;

            margin-top: 12px;

        }


        .summary-card {

            min-width: 0;

            background: white;

            border: 1px solid var(--border);

            border-radius: 15px;

            padding: 13px;

        }


        .summary-icon {

            width: 30px;
            height: 30px;

            display: grid;
            place-items: center;

            border-radius: 9px;

            background: var(--pink-light);

            font-size: 14px;

        }


        .summary-card:nth-child(2)
        .summary-icon {

            background: var(--purple-light);

        }


        .summary-card:nth-child(3)
        .summary-icon {

            background: #eaf2fb;

        }


        .summary-label {

            margin-top: 9px;

            color: var(--muted);

            font-size: 8px;

            line-height: 1.4;

        }


        .summary-value {

            margin-top: 3px;

            font-size: 12px;

            font-weight: 700;

            line-height: 1.4;

            word-break: break-word;

        }


        /* =========================
           BOTTOM NAV
        ========================= */

        .bottom-nav {

            position: fixed;

            left: 50%;
            bottom: 12px;

            transform: translateX(-50%);

            width: calc(100% - 28px);

            max-width: 570px;

            padding: 6px;

            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 3px;

            border-radius: 17px;

            background:
                rgba(255,255,255,0.96);

            border: 1px solid var(--border);

            box-shadow:
                0 10px 35px
                rgba(60,45,55,0.13);

            backdrop-filter: blur(15px);

            z-index: 100;

        }


        .nav-item {

            min-width: 0;

            padding: 7px 3px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 2px;

            border: 0;

            background: transparent;

            color: var(--muted);

            border-radius: 11px;

            cursor: pointer;

            font-size: 8px;

            white-space: nowrap;

        }


        .nav-item span:first-child {

            font-size: 15px;

            line-height: 1;

        }


        .nav-item.active {

            color: var(--pink);

            background: var(--pink-light);

            font-weight: 600;

        }


        /* =========================
           TABLET / DESKTOP
        ========================= */

        @media (min-width: 701px) {

            .header {

                height: 78px;

            }


            .container {

                padding-bottom: 120px;

            }


            .page-title {

                padding-top: 25px;

                margin-bottom: 25px;

            }


            .page-title h1 {

                font-size: 35px;

            }


            .page-title p {

                font-size: 12px;

            }


            .calendar-card {

                padding: 30px;

                border-radius: 27px;

            }


            .calendar-grid,
            .weekdays {

                gap: 8px;

            }


            .day {

                height: 76px;

                padding: 10px;

                border-radius: 15px;

            }


            .day-number {

                font-size: 13px;

            }


            .summary {

                gap: 16px;

                margin-top: 18px;

            }


            .summary-card {

                padding: 21px;

                border-radius: 20px;

            }


            .summary-label {

                font-size: 10px;

            }


            .summary-value {

                font-size: 18px;

            }

        }


        /* =========================
           SMALL PHONES
        ========================= */

        @media (max-width: 380px) {

            .header {

                width: calc(100% - 24px);

            }


            .container {

                width: calc(100% - 24px);

            }


            .page-title h1 {

                font-size: 24px;

            }


            .page-title p {

                font-size: 10px;

            }


            .calendar-card {

                padding: 12px;

                border-radius: 17px;

            }


            .calendar-grid,
            .weekdays {

                gap: 3px;

            }


            .day {

                height: 48px;

                padding: 6px;

                border-radius: 8px;

            }


            .day-number {

                font-size: 10px;

            }


            .period-dot,
            .predicted-dot {

                left: 6px;
                bottom: 6px;

                width: 5px;
                height: 5px;

            }


            .weekday {

                font-size: 8px;

            }


            .summary {

                gap: 7px;

            }


            .summary-card {

                padding: 10px;

            }


            .summary-icon {

                width: 27px;
                height: 27px;

                font-size: 12px;

            }


            .summary-label {

                font-size: 7px;

            }


            .summary-value {

                font-size: 10px;

            }


            .bottom-nav {

                width: calc(100% - 20px);

                bottom: 8px;

            }

        }


    </style>


    <script>

        /* =========================
           THEME
        ========================= */

        (function () {

            const theme =
                localStorage.getItem("bloom_theme")
                || "light";

            if (theme === "dark") {

                document.documentElement
                    .classList.add("dark-mode");

            }

        })();

    </script>

</head>


<body>


    <!-- HEADER -->

    <header class="header">

        <div class="logo">

            <div class="logo-icon">
                ✿
            </div>

            Bloom

        </div>


        <button
            class="back-btn"
            onclick="goDashboard()"
        >
            ← Dashboard
        </button>

    </header>



    <!-- MAIN -->

    <main class="container">


        <!-- TITLE -->

        <section class="page-title">

            <small>
                BLOOM CALENDAR
            </small>

            <h1>
                ปฏิทินรอบเดือน
            </h1>

            <p>
                ดูประวัติและการคาดการณ์ในแต่ละวัน
            </p>

        </section>



        <!-- CALENDAR -->

        <section class="calendar-card">


            <!-- MONTH HEADER -->

            <div class="calendar-header">

                <button
                    class="month-btn"
                    onclick="previousMonth()"
                    aria-label="เดือนก่อนหน้า"
                >
                    ‹
                </button>


                <div class="month-title">

                    <strong id="monthTitle">
                        -
                    </strong>

                    <small id="monthYear">
                        -
                    </small>

                </div>


                <button
                    class="month-btn"
                    onclick="nextMonth()"
                    aria-label="เดือนถัดไป"
                >
                    ›
                </button>

            </div>



            <!-- WEEKDAYS -->

            <div class="weekdays">

                <div class="weekday">อา.</div>
                <div class="weekday">จ.</div>
                <div class="weekday">อ.</div>
                <div class="weekday">พ.</div>
                <div class="weekday">พฤ.</div>
                <div class="weekday">ศ.</div>
                <div class="weekday">ส.</div>

            </div>



            <!-- DAYS -->

            <div
                class="calendar-grid"
                id="calendarGrid"
            ></div>



            <!-- LEGEND -->

            <div class="legend">

                <div class="legend-item">

                    <span
                        class="legend-dot legend-period"
                    ></span>

                    มีประจำเดือน

                </div>


                <div class="legend-item">

                    <span
                        class="legend-dot legend-predicted"
                    ></span>

                </div>


                <div class="legend-item">

                    <span
                        class="legend-dot legend-today"
                    ></span>

                    วันนี้

                </div>

            </div>


        </section>



        <!-- SUMMARY -->

        <section class="summary">


            <div class="summary-card">

                <div class="summary-icon">
                    🩸
                </div>

                <div class="summary-label">
                    รอบล่าสุด
                </div>

                <div
                    class="summary-value"
                    id="lastPeriod"
                >
                    —
                </div>

            </div>



            <div class="summary-card">

                <div class="summary-icon">
                    🌸
                </div>

                <div class="summary-label">
                    รอบถัดไปโดยประมาณ
                </div>

                <div
                    class="summary-value"
                    id="nextPeriod"
                >
                    —
                </div>

            </div>



            <div class="summary-card">

                <div class="summary-icon">
                    🔄
                </div>

                <div class="summary-label">
                    รอบเฉลี่ย
                </div>

                <div
                    class="summary-value"
                    id="averageCycle"
                >
                    —
                </div>

            </div>


        </section>


    </main>



    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">


        <button
            class="nav-item"
            onclick="goDashboard()"
        >

            <span>⌂</span>

            <span>
                หน้าหลัก
            </span>

        </button>



        <button
            class="nav-item active"
        >

            <span>▣</span>

            <span>
                ปฏิทิน
            </span>

        </button>



        <button
            class="nav-item"
            onclick="goDashboardStats()"
        >

            <span>◈</span>

            <span>
                สถิติ
            </span>

        </button>



        <button
            class="nav-item"
            onclick="showInfo()"
        >

            <span>⚙</span>

            <span>
                ตั้งค่า
            </span>

        </button>


    </nav>



    <script>

        /* =========================
           STORAGE
        ========================= */

        const STORAGE_KEY =
            "bloom_periods";


        function getPeriods() {

            try {

                return JSON.parse(
                    localStorage.getItem(
                        STORAGE_KEY
                    )
                ) || [];

            } catch (error) {

                return [];

            }

        }



        /* =========================
           DATE FUNCTIONS
        ========================= */

        function parseDate(value) {

            const parts =
                value.split("-").map(Number);

            return new Date(
                parts[0],
                parts[1] - 1,
                parts[2]
            );

        }


        function dateKey(date) {

            const year =
                date.getFullYear();

            const month =
                String(
                    date.getMonth() + 1
                ).padStart(2, "0");

            const day =
                String(
                    date.getDate()
                ).padStart(2, "0");

            return (
                year +
                "-" +
                month +
                "-" +
                day
            );

        }


        function formatDate(date) {

            return date.toLocaleDateString(
                "th-TH",
                {
                    day: "numeric",
                    month: "short",
                    year: "numeric"
                }
            );

        }


        function diffDays(a, b) {

            const first =
                new Date(
                    a.getFullYear(),
                    a.getMonth(),
                    a.getDate()
                );

            const second =
                new Date(
                    b.getFullYear(),
                    b.getMonth(),
                    b.getDate()
                );

            return Math.round(
                (second - first) /
                86400000
            );

        }


        function addDays(date, days) {

            const result =
                new Date(date);

            result.setDate(
                result.getDate() + days
            );

            return result;

        }



        /* =========================
           CALCULATE
        ========================= */

        function calculateData(periods) {

            if (!periods.length) {

                return {

                    averageCycle: 28,

                    latest: null,

                    nextDate: null

                };

            }


            const sorted =
                [...periods].sort(
                    (a, b) =>
                        parseDate(a.start) -
                        parseDate(b.start)
                );


            const cycles = [];


            for (
                let i = 1;
                i < sorted.length;
                i++
            ) {

                const cycle =
                    diffDays(
                        parseDate(
                            sorted[i - 1].start
                        ),
                        parseDate(
                            sorted[i].start
                        )
                    );


                if (
                    cycle > 0 &&
                    cycle < 100
                ) {

                    cycles.push(cycle);

                }

            }


            const averageCycle =
                cycles.length
                    ? Math.round(
                        cycles.reduce(
                            (sum, value) =>
                                sum + value,
                            0
                        ) / cycles.length
                    )
                    : 28;


            const latest =
                sorted[
                    sorted.length - 1
                ];


            let nextDate =
                addDays(
                    parseDate(
                        latest.start
                    ),
                    averageCycle
                );


            const today =
                new Date();


            while (nextDate < today) {

                nextDate =
                    addDays(
                        nextDate,
                        averageCycle
                    );

            }


            return {

                averageCycle,
                latest,
                nextDate

            };

        }



        /* =========================
           CURRENT MONTH
        ========================= */

        let currentDate =
            new Date();


        function previousMonth() {

            currentDate =
                new Date(
                    currentDate.getFullYear(),
                    currentDate.getMonth() - 1,
                    1
                );

            renderCalendar();

        }


        function nextMonth() {

            currentDate =
                new Date(
                    currentDate.getFullYear(),
                    currentDate.getMonth() + 1,
                    1
                );

            renderCalendar();

        }



        /* =========================
           RENDER CALENDAR
        ========================= */

        function renderCalendar() {

            const year =
                currentDate.getFullYear();

            const month =
                currentDate.getMonth();


            const monthName =
                currentDate.toLocaleDateString(
                    "th-TH",
                    {
                        month: "long"
                    }
                );


            document.getElementById(
                "monthTitle"
            ).textContent =
                monthName;


            document.getElementById(
                "monthYear"
            ).textContent =
                year + " • ค.ศ. " + year;


            const grid =
                document.getElementById(
                    "calendarGrid"
                );


            grid.innerHTML = "";


            const periods =
                getPeriods();


            const data =
                calculateData(periods);


            const firstDay =
                new Date(
                    year,
                    month,
                    1
                );


            const startWeekday =
                firstDay.getDay();


            const daysInMonth =
                new Date(
                    year,
                    month + 1,
                    0
                ).getDate();


            const previousDays =
                new Date(
                    year,
                    month,
                    0
                ).getDate();


            const today =
                new Date();


            /*
                สร้าง 42 ช่อง
            */

            for (
                let i = 0;
                i < 42;
                i++
            ) {

                let dayNumber;

                let cellMonth =
                    month;

                let cellYear =
                    year;

                let otherMonth =
                    false;


                /* เดือนก่อน */

                if (
                    i < startWeekday
                ) {

                    dayNumber =
                        previousDays -
                        startWeekday +
                        i +
                        1;

                    cellMonth =
                        month - 1;

                    otherMonth = true;


                    if (cellMonth < 0) {

                        cellMonth = 11;
                        cellYear--;

                    }

                }

                /* เดือนถัดไป */

                else if (
                    i >=
                    startWeekday +
                    daysInMonth
                ) {

                    dayNumber =
                        i -
                        startWeekday -
                        daysInMonth +
                        1;

                    cellMonth =
                        month + 1;

                    otherMonth = true;


                    if (cellMonth > 11) {

                        cellMonth = 0;
                        cellYear++;

                    }

                }

                /* เดือนปัจจุบัน */

                else {

                    dayNumber =
                        i -
                        startWeekday +
                        1;

                }


                const date =
                    new Date(
                        cellYear,
                        cellMonth,
                        dayNumber
                    );


                const cell =
                    document.createElement(
                        "div"
                    );


                cell.className = "day";


                if (otherMonth) {

                    cell.classList.add(
                        "other-month"
                    );

                }


                /* TODAY */

                if (
                    dateKey(date) ===
                    dateKey(today)
                ) {

                    cell.classList.add(
                        "today"
                    );

                }


                /* PERIOD */

                let isPeriod =
                    false;


                for (
                    const period
                    of periods
                ) {

                    if (
                        !period.start ||
                        !period.end
                    ) {

                        continue;

                    }


                    const start =
                        parseDate(
                            period.start
                        );

                    const end =
                        parseDate(
                            period.end
                        );


                    if (
                        date >= start &&
                        date <= end
                    ) {

                        isPeriod = true;

                        break;

                    }

                }


                if (isPeriod) {

                    cell.classList.add(
                        "period"
                    );

                }


                /* PREDICTED */

                let isPredicted =
                    false;


                if (data.nextDate) {

                    const predictionStart =
                        data.nextDate;


                    const predictionEnd =
                        addDays(
                            predictionStart,
                            4
                        );


                    if (
                        date >=
                        predictionStart &&
                        date <=
                        predictionEnd
                    ) {

                        isPredicted = true;

                    }

                }


                if (
                    isPredicted &&
                    !isPeriod
                ) {

                    cell.classList.add(
                        "predicted"
                    );

                }


                cell.innerHTML = `

                    <div class="day-number">
                        ${dayNumber}
                    </div>

                    ${
                        isPeriod
                        ?
                        `
                        <div
                            class="period-dot"
                        ></div>
                        `
                        :
                        ""
                    }

                    ${
                        isPredicted &&
                        !isPeriod
                        ?
                        `
                        <div
                            class="predicted-dot"
                        ></div>
                        `
                        :
                        ""
                    }

                `;


                grid.appendChild(cell);

            }


            updateSummary(data);

        }



        /* =========================
           SUMMARY
        ========================= */

        function updateSummary(data) {

            document.getElementById(
                "averageCycle"
            ).textContent =
                data.averageCycle +
                " วัน";


            if (data.latest) {

                document.getElementById(
                    "lastPeriod"
                ).textContent =
                    formatDate(
                        parseDate(
                            data.latest.start
                        )
                    );

            } else {

                document.getElementById(
                    "lastPeriod"
                ).textContent =
                    "ยังไม่มีข้อมูล";

            }


            if (data.nextDate) {

                document.getElementById(
                    "nextPeriod"
                ).textContent =
                    formatDate(
                        data.nextDate
                    );

            } else {

                document.getElementById(
                    "nextPeriod"
                ).textContent =
                    "ยังไม่มีข้อมูล";

            }

        }



        /* =========================
           NAVIGATION
        ========================= */

        function goDashboard() {

            window.location.href =
                "dashboard.html";

        }


        function goDashboardStats() {

            window.location.href =
                "stats.html";

        }


        function showInfo() {

            alert(
                "🔒 Bloom ใช้โหมดส่วนตัว\n\n" +
                "ข้อมูลทั้งหมดถูกเก็บไว้ใน Browser ของอุปกรณ์นี้\n\n" +
                "ไม่มีระบบ Login และไม่มีบัญชีผู้ใช้"
            );

        }



        /* =========================
           START
        ========================= */

        renderCalendar();

    </script>
